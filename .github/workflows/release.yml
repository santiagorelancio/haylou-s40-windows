name: Publicar instalable

# Genera el .zip portable (sin necesidad de instalar Python) y lo adjunta a una Release.
# Se ejecuta al subir una etiqueta "v*" o a mano desde la pestaña Actions.
# Firma: si existen los secretos SIGN_CERT_PFX_BASE64 y SIGN_CERT_PASSWORD, el .exe se firma.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release (ej. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 3.14 = Tcl/Tk 9, para el que está pensado rthook_tcl9.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias (versiones fijadas)
        run: python -m pip install -r requirements-lock.txt

      - name: Pruebas del protocolo
        run: python test_protocol.py

      - name: Empaquetar (y firmar si hay certificado)
        shell: pwsh
        env:
          SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: ./build.ps1 -NoInstall -DistDir dist -Zip -Python python

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create $env:VERSION Haylou-S40-Windows.zip `
            --title "Haylou S40 para Windows $env:VERSION" `
            --notes "Descarga **Haylou-S40-Windows.zip**, descomprímelo y abre **Haylou S40.exe**. No hace falta instalar Python. Si el programa no está firmado, Windows puede mostrar un aviso de SmartScreen: pulsa «Más información» y «Ejecutar de todas formas»."
